<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klockträning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(160deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
    }

    h1 { font-size: 2rem; letter-spacing: 3px; margin-bottom: 4px; }
    .subtitle { font-size: 0.85rem; opacity: 0.55; margin-bottom: 22px; }

    .top-bar {
      display: flex;
      gap: 14px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 0.9rem;
    }
    .stat strong { color: #ff6b6b; }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tbtn {
      padding: 7px 16px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      background: transparent;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.2s;
    }
    .tbtn.active {
      background: #ff6b6b;
      border-color: #ff6b6b;
      color: white;
      box-shadow: 0 0 18px rgba(255,107,107,0.45);
    }
    .tbtn:hover:not(.active) { border-color: rgba(255,255,255,0.6); color: white; }

    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }

    .question { font-size: 0.95rem; opacity: 0.75; text-align: center; }

    #clock-svg { filter: drop-shadow(0 4px 14px rgba(0,0,0,0.5)); }
    #clock-svg.interactive { cursor: crosshair; }

    .digital {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 6px;
      font-variant-numeric: tabular-nums;
      color: #ff6b6b;
      text-shadow: 0 0 24px rgba(255,107,107,0.5);
    }

    .answer-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .tinput {
      font-size: 2rem;
      width: 148px;
      padding: 10px;
      text-align: center;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: white;
      outline: none;
      font-variant-numeric: tabular-nums;
      letter-spacing: 4px;
      transition: border-color 0.2s;
    }
    .tinput::placeholder { color: rgba(255,255,255,0.25); }
    .tinput:focus { border-color: #ff6b6b; }
    .tinput.ok  { border-color: #4caf50; background: rgba(76,175,80,0.18); }
    .tinput.err { border-color: #f44336; background: rgba(244,67,54,0.15); }

    .hint { font-size: 0.78rem; opacity: 0.45; text-align: center; }

    .user-time {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 4px;
      font-variant-numeric: tabular-nums;
      color: #adf7ff;
    }

    .feedback {
      font-size: 1.05rem;
      font-weight: 600;
      min-height: 26px;
      text-align: center;
    }
    .feedback.ok  { color: #4caf50; }
    .feedback.err { color: #f44336; }

    .btn {
      padding: 12px 36px;
      border-radius: 30px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: #ff6b6b;
      color: white;
      box-shadow: 0 4px 18px rgba(255,107,107,0.4);
      transition: all 0.2s;
      letter-spacing: 1px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(255,107,107,0.55); }
    .btn:active { transform: translateY(0); }

    .ampm-badge {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 3px;
      padding: 4px 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      color: #adf7ff;
    }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .pop { animation: pop 0.25s ease; }
  </style>
</head>
<body>

<h1>Klockträning</h1>
<p class="subtitle">Öva analog &amp; digital klocka</p>

<div class="top-bar">
  <div class="stat">Poäng: <strong id="score-val">0</strong></div>
  <div class="stat">Rätt i rad: <strong id="streak-val">0</strong></div>
</div>

<div class="controls">
  <button class="tbtn active" id="btn-read" onclick="setMode('read')">Avläs klockan</button>
  <button class="tbtn"        id="btn-set"  onclick="setMode('set')">Ställ klockan</button>
  <button class="tbtn active" id="btn-easy" data-d="easy" onclick="setDiff('easy')">Lätt (5 min)</button>
  <button class="tbtn"        id="btn-hard" data-d="hard" onclick="setDiff('hard')">Svår (1 min)</button>
</div>

<div class="card">
  <p class="question" id="question"></p>

  <svg id="clock-svg" width="210" height="210" viewBox="0 0 210 210">
    <!-- Face -->
    <circle cx="105" cy="105" r="103" fill="white" stroke="#ccc" stroke-width="2"/>
    <circle cx="105" cy="105" r="99"  fill="#f9f9ff"/>
    <g id="ticks"></g>
    <g id="nums"></g>
    <!-- Hands (initial: 12:00) -->
    <line id="h-hand" x1="105" y1="105" x2="105" y2="52"
          stroke="#1a1a2e" stroke-width="7" stroke-linecap="round"/>
    <line id="m-hand" x1="105" y1="105" x2="105" y2="25"
          stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
    <!-- Center -->
    <circle cx="105" cy="105" r="8"  fill="#ff6b6b"/>
    <circle cx="105" cy="105" r="3"  fill="white"/>
  </svg>

  <div class="digital" id="digital-disp" style="display:none">00:00</div>

  <div class="answer-area" id="answer-area"></div>

  <div class="feedback" id="feedback"></div>

  <button class="btn" id="main-btn" onclick="onBtn()">Kontrollera</button>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
const CX = 105, CY = 105;
const H_LEN = 52, M_LEN = 76;

// ── State ─────────────────────────────────────────────────────────────────────
let mode     = 'read';
let diff     = 'easy';
let target   = { h: 0, m: 0 };
let userH    = 0, userM = 0;
let answered = false;
let dragging = null;  // 'h' | 'm' | null
let score    = 0, streak = 0;

// ── Build clock face ──────────────────────────────────────────────────────────
(function buildFace() {
  const tickG = document.getElementById('ticks');
  const numG  = document.getElementById('nums');

  for (let i = 0; i < 60; i++) {
    const a     = (i / 60) * 2 * Math.PI - Math.PI / 2;
    const major = i % 5 === 0;
    const r1    = major ? 85 : 91;
    const ln    = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', CX + r1   * Math.cos(a));
    ln.setAttribute('y1', CY + r1   * Math.sin(a));
    ln.setAttribute('x2', CX + 97   * Math.cos(a));
    ln.setAttribute('y2', CY + 97   * Math.sin(a));
    ln.setAttribute('stroke', major ? '#999' : '#ddd');
    ln.setAttribute('stroke-width', major ? '2.5' : '1');
    tickG.appendChild(ln);
  }

  for (let n = 1; n <= 12; n++) {
    const a = (n / 12) * 2 * Math.PI - Math.PI / 2;
    const r = 74;
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', CX + r * Math.cos(a));
    t.setAttribute('y', CY + r * Math.sin(a));
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dominant-baseline', 'central');
    t.setAttribute('font-size', '15');
    t.setAttribute('font-weight', 'bold');
    t.setAttribute('font-family', 'Segoe UI, sans-serif');
    t.setAttribute('fill', '#222');
    t.textContent = n;
    numG.appendChild(t);
  }
})();

// ── Render hands ──────────────────────────────────────────────────────────────
function renderHands(h, m) {
  const mA = (m / 60) * 2 * Math.PI - Math.PI / 2;
  const hA = ((h % 12 + m / 60) / 12) * 2 * Math.PI - Math.PI / 2;
  const hEl = document.getElementById('h-hand');
  const mEl = document.getElementById('m-hand');
  hEl.setAttribute('x2', CX + H_LEN * Math.cos(hA));
  hEl.setAttribute('y2', CY + H_LEN * Math.sin(hA));
  mEl.setAttribute('x2', CX + M_LEN * Math.cos(mA));
  mEl.setAttribute('y2', CY + M_LEN * Math.sin(mA));
}

function resetHandStyle() {
  document.getElementById('h-hand').setAttribute('stroke', '#1a1a2e');
  document.getElementById('m-hand').setAttribute('stroke', '#2c3e50');
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(h, m) {
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function randTime() {
  const h = Math.floor(Math.random() * 24);
  const m = diff === 'easy'
    ? Math.floor(Math.random() * 12) * 5
    : Math.floor(Math.random() * 60);
  return { h, m };
}

function ampm(h) { return h < 12 ? 'FM' : 'EM'; }

// ── Next question ─────────────────────────────────────────────────────────────
function nextQ() {
  answered = false;
  dragging = null;
  target   = randTime();

  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className   = 'feedback';
  document.getElementById('main-btn').textContent = 'Kontrollera';
  resetHandStyle();

  if (mode === 'read') {
    renderHands(target.h, target.m);
    setupRead();
  } else {
    userH = 0; userM = 0;
    renderHands(0, 0);
    setupSet();
  }
}

// ── Read mode (analog → type digital) ────────────────────────────────────────
function setupRead() {
  document.getElementById('question').textContent       = 'Vad är klockan? Skriv 24-timmarsformat:';
  document.getElementById('digital-disp').style.display = 'none';
  document.getElementById('clock-svg').classList.remove('interactive');
  const badge = ampm(target.h);
  document.getElementById('answer-area').innerHTML = `
    <div class="ampm-badge">${badge}</div>
    <input id="tinput" class="tinput" placeholder="HH:MM" maxlength="5"
           autocomplete="off" spellcheck="false"
           oninput="autoColon(this)"
           onkeydown="if(event.key==='Enter')onBtn()">
  `;
  setTimeout(() => document.getElementById('tinput')?.focus(), 50);
}

function autoColon(el) {
  let v = el.value.replace(/\D/g, '');
  if (v.length > 2) v = v.slice(0,2) + ':' + v.slice(2,4);
  el.value = v;
}

function checkRead() {
  const el = document.getElementById('tinput');
  if (!el) return false;
  const mt = el.value.trim().match(/^(\d{1,2}):(\d{2})$/);
  if (!mt) {
    showMsg('Ange tid som HH:MM', false, false);
    answered = false;
    return null; // invalid format — don't count
  }
  const ah = +mt[1], am = +mt[2];
  const ok = ah === target.h && am === target.m;
  el.disabled = true;
  el.className = 'tinput ' + (ok ? 'ok' : 'err');
  return ok;
}

// ── Set mode (digital → drag analog) ─────────────────────────────────────────
function setupSet() {
  document.getElementById('question').textContent       = 'Ställ klockan — dra visarna:';
  document.getElementById('digital-disp').style.display = 'block';
  document.getElementById('digital-disp').textContent   = fmt(target.h, target.m);
  document.getElementById('clock-svg').classList.add('interactive');
  document.getElementById('answer-area').innerHTML = `
    <p class="hint">Klicka/dra timvisaren och minutvisaren</p>
    <div class="user-time" id="user-time">${fmt(0,0)}</div>
  `;
}

function checkSet() {
  return userH === target.h % 12 && userM === target.m;
}

// ── Main button ───────────────────────────────────────────────────────────────
function onBtn() {
  if (answered) { nextQ(); return; }

  let ok;
  if (mode === 'read') {
    ok = checkRead();
    if (ok === null) return; // bad format, don't proceed
  } else {
    ok = checkSet();
    if (!ok) renderHands(target.h, target.m); // reveal answer on clock
  }

  answered = true;
  if (ok) {
    score  += 10;
    streak += 1;
    showMsg(streak > 1 ? `Rätt!  ${streak} i rad!` : 'Rätt!', true);
    animateBtn();
  } else {
    streak = 0;
    showMsg(`Fel.  Rätt svar: ${fmt(target.h, target.m)}`, false);
  }

  document.getElementById('score-val').textContent  = score;
  document.getElementById('streak-val').textContent = streak;
  document.getElementById('main-btn').textContent   = 'Nästa →';
}

function showMsg(txt, ok, persist = true) {
  const el = document.getElementById('feedback');
  el.textContent = txt;
  el.className   = persist ? ('feedback ' + (ok ? 'ok' : 'err')) : 'feedback err';
}

function animateBtn() {
  const btn = document.getElementById('main-btn');
  btn.classList.remove('pop');
  void btn.offsetWidth;
  btn.classList.add('pop');
}

// ── Drag interaction ──────────────────────────────────────────────────────────
function svgXY(e, svgEl) {
  const rect = svgEl.getBoundingClientRect();
  const cl   = e.touches ? e.touches[0] : e;
  return {
    x: (cl.clientX - rect.left) * (210 / rect.width),
    y: (cl.clientY - rect.top)  * (210 / rect.height)
  };
}

function segDist(px, py, ax, ay, bx, by) {
  const dx = bx-ax, dy = by-ay;
  const t  = Math.max(0, Math.min(1, ((px-ax)*dx + (py-ay)*dy) / (dx*dx+dy*dy)));
  return Math.hypot(px - (ax+t*dx), py - (ay+t*dy));
}

function getHandTips() {
  const hA = ((userH % 12 + userM / 60) / 12) * 2 * Math.PI - Math.PI / 2;
  const mA = (userM / 60) * 2 * Math.PI - Math.PI / 2;
  return {
    hx: CX + H_LEN * Math.cos(hA), hy: CY + H_LEN * Math.sin(hA),
    mx: CX + M_LEN * Math.cos(mA), my: CY + M_LEN * Math.sin(mA)
  };
}

function onDown(e) {
  if (mode !== 'set' || answered) return;
  const svg  = document.getElementById('clock-svg');
  const {x,y} = svgXY(e, svg);
  const {hx,hy,mx,my} = getHandTips();

  const dh = segDist(x, y, CX, CY, hx, hy);
  const dm = segDist(x, y, CX, CY, mx, my);

  dragging = (dh < 22 && dh <= dm) ? 'h' : 'm';
  e.preventDefault();
  onMove(e);
}

function onMove(e) {
  if (!dragging || mode !== 'set' || answered) return;
  e.preventDefault();

  const svg    = document.getElementById('clock-svg');
  const {x,y}  = svgXY(e, svg);
  const rawAng = Math.atan2(y - CY, x - CX) + Math.PI / 2;
  const norm   = ((rawAng % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI); // 0..2π

  if (dragging === 'm') {
    const rawM = (norm / (2*Math.PI)) * 60;
    userM = diff === 'easy'
      ? Math.round(rawM / 5) * 5 % 60
      : Math.round(rawM) % 60;
  } else {
    const rawH = (norm / (2*Math.PI)) * 12;
    userH = Math.round(rawH) % 12;
  }

  renderHands(userH, userM);
  const ut = document.getElementById('user-time');
  if (ut) ut.textContent = fmt(userH, userM);
}

function onUp() { dragging = null; }

// ── Mode / difficulty switches ────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById('btn-read').classList.toggle('active', m === 'read');
  document.getElementById('btn-set').classList.toggle('active',  m === 'set');
  nextQ();
}

function setDiff(d) {
  diff = d;
  document.getElementById('btn-easy').classList.toggle('active', d === 'easy');
  document.getElementById('btn-hard').classList.toggle('active', d === 'hard');
  nextQ();
}

// ── Bind events ───────────────────────────────────────────────────────────────
const svg = document.getElementById('clock-svg');
svg.addEventListener('mousedown',  onDown);
svg.addEventListener('touchstart', onDown, { passive: false });
window.addEventListener('mousemove',  onMove);
window.addEventListener('touchmove',  onMove, { passive: false });
window.addEventListener('mouseup',  onUp);
window.addEventListener('touchend', onUp);

// ── Start ─────────────────────────────────────────────────────────────────────
nextQ();
</script>
</body>
</html>
