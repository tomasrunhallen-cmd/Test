<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klockan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(160deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 14px 40px;
      color: white;
    }

    h1 { font-size: 2rem; letter-spacing: 4px; margin-bottom: 2px; }
    .subtitle { font-size: 0.78rem; opacity: 0.45; margin-bottom: 14px; }

    .scorebar { display: flex; gap: 10px; margin-bottom: 14px; }
    .stat {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 5px 15px;
      border-radius: 30px;
      font-size: 0.82rem;
    }
    .stat strong { color: #ff6b6b; }

    .mode-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .mbtn {
      padding: 7px 18px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.22);
      background: transparent;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.2s;
    }
    .mbtn.active { background: #ff6b6b; border-color: #ff6b6b; color: white; box-shadow: 0 0 14px rgba(255,107,107,0.4); }

    .level-row {
      display: flex; gap: 6px; margin-bottom: 16px;
      flex-wrap: wrap; justify-content: center;
    }
    .lbtn {
      padding: 6px 12px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.18);
      background: transparent;
      color: rgba(255,255,255,0.55);
      cursor: pointer;
      font-size: 0.77rem;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .lbtn.active { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.5); color: white; }

    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 24px;
      padding: 22px 18px 26px;
      display: flex; flex-direction: column; align-items: center;
      gap: 12px;
      width: 100%; max-width: 370px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .question { font-size: 0.9rem; opacity: 0.72; text-align: center; }

    #clock-svg { filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4)); display: block; touch-action: none; }
    #clock-svg.interactive { cursor: crosshair; }

    .hand-labels {
      display: none;
      justify-content: space-between;
      width: 220px;
      font-size: 0.72rem;
      padding: 0 4px;
      opacity: 0.7;
    }
    .hl-h { color: #ffaaaa; }
    .hl-m { color: #aaddff; }

    .ctx-badge {
      font-size: 0.88rem;
      padding: 4px 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #ffe;
    }

    .digital {
      font-size: 2.8rem; font-weight: 700;
      letter-spacing: 6px; font-variant-numeric: tabular-nums;
      color: #ff6b6b; text-shadow: 0 0 20px rgba(255,107,107,0.45);
    }

    .answer-area { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }

    .tinput {
      font-size: 2rem; width: 148px; padding: 10px;
      text-align: center; border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08); color: white;
      outline: none; font-variant-numeric: tabular-nums; letter-spacing: 4px;
      transition: border-color 0.2s;
    }
    .tinput::placeholder { color: rgba(255,255,255,0.2); }
    .tinput:focus { border-color: #ff6b6b; }
    .tinput.ok  { border-color: #4caf50; background: rgba(76,175,80,0.14); }
    .tinput.err { border-color: #f44336; background: rgba(244,67,54,0.11); }

    .user-time {
      font-size: 1.4rem; font-weight: 600;
      letter-spacing: 4px; font-variant-numeric: tabular-nums;
      color: #adf7ff;
    }

    .drag-hint { font-size: 0.74rem; opacity: 0.42; text-align: center; }

    /* Multiple-choice buttons */
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }
    .cbtn {
      padding: 16px 8px;
      font-size: 1.35rem; font-weight: 700;
      font-variant-numeric: tabular-nums; letter-spacing: 2px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: white; cursor: pointer;
      transition: all 0.15s;
    }
    .cbtn:hover:not(:disabled) { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.5); transform: scale(1.03); }
    .cbtn.correct { background: rgba(76,175,80,0.35);  border-color: #4caf50; }
    .cbtn.wrong   { background: rgba(244,67,54,0.25); border-color: #f44336; }
    .cbtn:disabled { cursor: default; }

    /* Pedagogical box shown after answering */
    .verbal-box {
      width: 100%;
      background: rgba(255,214,102,0.1);
      border: 1px solid rgba(255,214,102,0.25);
      border-radius: 12px;
      padding: 10px 14px;
      display: none;
      flex-direction: column;
      gap: 5px;
    }
    .verbal-box.show { display: flex; animation: fadein 0.3s ease; }
    .verbal-main {
      font-size: 1.05rem; font-weight: 700;
      color: #ffd166; text-align: center; letter-spacing: 1px;
    }
    .verbal-tip {
      font-size: 0.78rem; color: #adf7ff;
      text-align: center; opacity: 0.85;
    }

    .feedback { font-size: 0.95rem; font-weight: 600; min-height: 22px; text-align: center; }
    .feedback.ok  { color: #5dca6a; }
    .feedback.err { color: #f44336; }

    .btn {
      padding: 12px 38px; border-radius: 30px; border: none;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      background: #ff6b6b; color: white;
      box-shadow: 0 4px 16px rgba(255,107,107,0.38);
      transition: all 0.2s; letter-spacing: 1px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(255,107,107,0.5); }
    .btn:active { transform: translateY(0); }

    @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.13)} 100%{transform:scale(1)} }
    .pop { animation: pop 0.22s ease; }
    @keyframes fadein { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>

<h1>Klockan</h1>
<p class="subtitle">Öva analog &amp; digital klocka</p>

<div class="scorebar">
  <div class="stat">Poäng: <strong id="score-val">0</strong></div>
  <div class="stat">Rätt i rad: <strong id="streak-val">0</strong></div>
</div>

<div class="mode-row">
  <button class="mbtn active" id="btn-choice" onclick="setMode('choice')">Välj tid</button>
  <button class="mbtn"        id="btn-read"   onclick="setMode('read')">Skriv tid</button>
  <button class="mbtn"        id="btn-set"     onclick="setMode('set')">Ställ klockan</button>
  <button class="mbtn"        id="btn-convert" onclick="setMode('convert')">13 → 01 ?</button>
</div>

<div class="level-row">
  <button class="lbtn active" data-li="0" onclick="setLevel(0)">🌱 Nybörjare</button>
  <button class="lbtn"        data-li="1" onclick="setLevel(1)">⭐ Lätt</button>
  <button class="lbtn"        data-li="2" onclick="setLevel(2)">⭐⭐ Medel</button>
  <button class="lbtn"        data-li="3" onclick="setLevel(3)">⭐⭐⭐ Svår</button>
</div>

<div class="card">
  <p class="question" id="question"></p>

  <svg id="clock-svg" width="214" height="214" viewBox="0 0 214 214">
    <circle cx="107" cy="107" r="105" fill="white" stroke="#ccc" stroke-width="2"/>
    <circle cx="107" cy="107" r="101" fill="#f9f9ff"/>
    <g id="ticks"></g>
    <g id="nums"></g>
    <line id="h-hand" x1="107" y1="107" x2="107" y2="53"
          stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
    <line id="m-hand" x1="107" y1="107" x2="107" y2="25"
          stroke="#2471a3" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="107" cy="107" r="9"  fill="#2c3e50"/>
    <circle cx="107" cy="107" r="4"  fill="white"/>
  </svg>

  <div class="hand-labels" id="hand-labels">
    <span class="hl-h">▲ timvisare<br>(kort, röd)</span>
    <span class="hl-m" style="text-align:right">minutvisare ▲<br>(lång, blå)</span>
  </div>

  <div class="digital" id="digital-disp" style="display:none">00:00</div>

  <div class="answer-area" id="answer-area"></div>

  <div class="verbal-box" id="verbal-box">
    <div class="verbal-main" id="verbal-main"></div>
    <div class="verbal-tip"  id="verbal-tip"></div>
  </div>

  <div class="feedback" id="feedback"></div>

  <button class="btn" id="main-btn" onclick="onBtn()">Kontrollera</button>
</div>

<script>
const CX = 107, CY = 107, H_LEN = 53, M_LEN = 78;

// ── Levels ────────────────────────────────────────────────────────────────────
const LEVELS = [
  { label:'Nybörjare', minutes:[0],                                         svår:false },
  { label:'Lätt',      minutes:[0,30],                                      svår:false },
  { label:'Medel',     minutes:[0,5,10,15,20,25,30,35,40,45,50,55],         svår:false },
  { label:'Svår',      minutes:null,                                        svår:true  },
];

// ── Swedish clock vocabulary ──────────────────────────────────────────────────
const ORD = ['tolv','ett','två','tre','fyra','fem','sex','sju','åtta','nio','tio','elva'];

function toSwedish(h, m) {
  const h12  = h % 12;
  const curr = ORD[h12];
  const next = ORD[(h12 + 1) % 12];
  switch (m) {
    case  0: return `klockan ${curr}`;
    case  5: return `fem över ${curr}`;
    case 10: return `tio över ${curr}`;
    case 15: return `kvart över ${curr}`;
    case 20: return `tjugo över ${curr}`;
    case 25: return `fem i halv ${next}`;
    case 30: return `halv ${next}`;
    case 35: return `fem över halv ${next}`;
    case 40: return `tjugo i ${next}`;
    case 45: return `kvart i ${next}`;
    case 50: return `tio i ${next}`;
    case 55: return `fem i ${next}`;
    default: return m < 30 ? `${m} minuter över ${curr}` : `${60-m} minuter i ${next}`;
  }
}

function halvTip(h, m) {
  if (m !== 30) return null;
  const h12  = h % 12;
  const curr = ORD[h12];
  const next = ORD[(h12 + 1) % 12];
  return `Halv ${next} = halvvägs från ${curr} till ${next} — inte halv ${curr}!`;
}

function kvartTip(m) {
  if (m === 15) return 'Kvart över = 15 minuter har gått';
  if (m === 45) return 'Kvart i = 15 minuter kvar till nästa timme';
  return null;
}

// ── Day context for 24h ───────────────────────────────────────────────────────
function dayCtx(h) {
  if (h >= 5  && h < 10) return '🌅 Morgon';
  if (h >= 10 && h < 13) return '☀️ Förmiddag';
  if (h >= 13 && h < 18) return '🌤️ Eftermiddag';
  if (h >= 18 && h < 23) return '🌆 Kväll';
  return '🌙 Natt';
}

// ── State ─────────────────────────────────────────────────────────────────────
let mode     = 'choice';
let levelIdx = 0;
let target   = { h: 0, m: 0 };
let userH    = 0, userM = 0;
let answered = false;
let dragging = null;
let score    = 0, streak = 0;

// ── Build clock face ──────────────────────────────────────────────────────────
(function buildFace() {
  const tickG = document.getElementById('ticks');
  const numG  = document.getElementById('nums');
  for (let i = 0; i < 60; i++) {
    const a     = (i/60)*2*Math.PI - Math.PI/2;
    const major = i % 5 === 0;
    const r1    = major ? 87 : 93;
    const ln    = document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1', CX + r1 * Math.cos(a));
    ln.setAttribute('y1', CY + r1 * Math.sin(a));
    ln.setAttribute('x2', CX + 99 * Math.cos(a));
    ln.setAttribute('y2', CY + 99 * Math.sin(a));
    ln.setAttribute('stroke', major ? '#888' : '#ddd');
    ln.setAttribute('stroke-width', major ? '2.5' : '1');
    tickG.appendChild(ln);
  }
  for (let n = 1; n <= 12; n++) {
    const a = (n/12)*2*Math.PI - Math.PI/2;
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x', CX + 76*Math.cos(a));
    t.setAttribute('y', CY + 76*Math.sin(a));
    t.setAttribute('text-anchor','middle');
    t.setAttribute('dominant-baseline','central');
    t.setAttribute('font-size','16');
    t.setAttribute('font-weight','bold');
    t.setAttribute('font-family','Segoe UI, sans-serif');
    t.setAttribute('fill','#222');
    t.textContent = n;
    numG.appendChild(t);
  }
})();

// ── Render hands ──────────────────────────────────────────────────────────────
function renderHands(h, m) {
  const mA = (m/60)*2*Math.PI - Math.PI/2;
  const hA = ((h%12 + m/60)/12)*2*Math.PI - Math.PI/2;
  document.getElementById('h-hand').setAttribute('x2', CX + H_LEN*Math.cos(hA));
  document.getElementById('h-hand').setAttribute('y2', CY + H_LEN*Math.sin(hA));
  document.getElementById('m-hand').setAttribute('x2', CX + M_LEN*Math.cos(mA));
  document.getElementById('m-hand').setAttribute('y2', CY + M_LEN*Math.sin(mA));
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(h, m) {
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function randTime() {
  const lvl = LEVELS[levelIdx];
  const ms  = lvl.minutes;
  const m   = ms ? ms[Math.floor(Math.random()*ms.length)] : Math.floor(Math.random()*60);
  // Convert mode: only afternoon/evening hours 13-23
  const h = mode === 'convert'
    ? 13 + Math.floor(Math.random()*11)
    : Math.floor(Math.random()*24);
  return { h, m };
}

// ── Next question ─────────────────────────────────────────────────────────────
function nextQ() {
  answered = false;
  dragging = null;
  target   = randTime();

  document.getElementById('feedback').textContent  = '';
  document.getElementById('feedback').className    = 'feedback';
  document.getElementById('main-btn').textContent  = 'Kontrollera';
  document.getElementById('main-btn').style.display = mode === 'choice' ? 'none' : 'block';
  document.getElementById('verbal-box').className  = 'verbal-box';
  document.getElementById('verbal-main').textContent = '';
  document.getElementById('verbal-tip').textContent  = '';
  document.getElementById('h-hand').setAttribute('stroke','#c0392b');
  document.getElementById('m-hand').setAttribute('stroke','#2471a3');

  document.getElementById('hand-labels').style.display = levelIdx === 0 ? 'flex' : 'none';

  if (mode === 'choice') {
    renderHands(target.h, target.m);
    setupChoice();
  } else if (mode === 'read') {
    renderHands(target.h, target.m);
    setupRead();
  } else if (mode === 'set') {
    userH = 0; userM = 0;
    renderHands(0, 0);
    setupSet();
  } else {
    renderHands(target.h, target.m);
    setupConvert();
  }
}

// ── Choice mode (multiple choice, no typing) ──────────────────────────────────
function generateChoices(h, m) {
  const lvl      = LEVELS[levelIdx];
  const validMs  = lvl.minutes || [0,5,10,15,20,25,30,35,40,45,50,55];
  const correct  = fmt(h, m);
  const choices  = [correct];

  let tries = 0;
  while (choices.length < 4 && tries++ < 100) {
    let wh = h, wm = m;
    const r = Math.random();
    if (r < 0.45) {
      // Different hour, same minute
      const delta = 1 + Math.floor(Math.random() * 3);
      wh = (h + (Math.random() < 0.5 ? delta : -delta) + 24) % 24;
    } else if (r < 0.8) {
      // Same hour, different minute (fall back to hour change if only one valid minute)
      const others = validMs.filter(x => x !== m);
      if (others.length > 0) {
        wm = others[Math.floor(Math.random() * others.length)];
      } else {
        const delta = 1 + Math.floor(Math.random() * 3);
        wh = (h + (Math.random() < 0.5 ? delta : -delta) + 24) % 24;
      }
    } else {
      // Both different
      wh = Math.floor(Math.random() * 24);
      wm = validMs[Math.floor(Math.random() * validMs.length)];
    }
    const w = fmt(wh, wm);
    if (!choices.includes(w)) choices.push(w);
  }

  return choices.sort(() => Math.random() - 0.5);
}

function setupChoice() {
  document.getElementById('question').textContent        = 'Vad är klockan? Tryck på rätt svar:';
  document.getElementById('digital-disp').style.display = 'none';
  document.getElementById('clock-svg').classList.remove('interactive');
  document.getElementById('main-btn').style.display     = 'none';

  const correct = fmt(target.h, target.m);
  const choices = generateChoices(target.h, target.m);

  document.getElementById('answer-area').innerHTML = `
    <div class="ctx-badge">${dayCtx(target.h)}</div>
    <div class="choices">
      ${choices.map(c => `
        <button class="cbtn" data-val="${c}" onclick="onChoose('${c}')">
          ${c}
        </button>`).join('')}
    </div>
  `;
}

function onChoose(chosen) {
  if (answered) return;
  answered = true;
  const correct = fmt(target.h, target.m);
  const ok      = chosen === correct;

  document.querySelectorAll('.cbtn').forEach(b => {
    b.disabled = true;
    if (b.dataset.val === correct)              b.classList.add('correct');
    else if (b.dataset.val === chosen && !ok)  b.classList.add('wrong');
  });

  // Show pedagogical box
  const verbal = toSwedish(target.h, target.m);
  document.getElementById('verbal-main').textContent = verbal.charAt(0).toUpperCase() + verbal.slice(1);
  const tip = halvTip(target.h, target.m) || (levelIdx <= 2 ? kvartTip(target.m) : null);
  const tipEl = document.getElementById('verbal-tip');
  tipEl.textContent   = tip || '';
  tipEl.style.display = tip ? 'block' : 'none';
  document.getElementById('verbal-box').className = 'verbal-box show';

  if (ok) {
    score += 10; streak++;
    const cheer = CHEER[Math.floor(Math.random()*CHEER.length)];
    showFb(streak > 2 ? `${cheer} ${streak} i rad! 🔥` : cheer, true);
    animBtn();
  } else {
    streak = 0;
    showFb(`Inte riktigt. Rätt svar: ${correct}`, false);
  }
  document.getElementById('score-val').textContent  = score;
  document.getElementById('streak-val').textContent = streak;

  const btn = document.getElementById('main-btn');
  btn.style.display   = 'block';
  btn.textContent     = 'Nästa →';
}

// ── Read mode ─────────────────────────────────────────────────────────────────
function setupRead() {
  const svår = LEVELS[levelIdx].svår;
  document.getElementById('question').textContent        = 'Vad är klockan? Skriv svaret:';
  document.getElementById('digital-disp').style.display = 'none';
  document.getElementById('clock-svg').classList.remove('interactive');

  document.getElementById('answer-area').innerHTML = `
    <div class="ctx-badge">${dayCtx(target.h)}</div>
    <input id="tinput" class="tinput" placeholder="HH:MM" maxlength="5"
           inputmode="numeric" autocomplete="off" spellcheck="false"
           oninput="autoColon(this)" onkeydown="if(event.key==='Enter')onBtn()">
  `;
  setTimeout(() => document.getElementById('tinput')?.focus(), 50);
}

function autoColon(el) {
  let v = el.value.replace(/\D/g,'');
  if (v.length > 2) v = v.slice(0,2) + ':' + v.slice(2,4);
  el.value = v;
}

function checkRead() {
  const el = document.getElementById('tinput');
  if (!el) return null;
  const mt = el.value.trim().match(/^(\d{1,2}):(\d{2})$/);
  if (!mt) {
    showFb('Skriv tid som T:MM (t.ex. 3:00)', false, false);
    answered = false;
    return null;
  }
  const ah = +mt[1], am = +mt[2];
  const ok = ah === target.h && am === target.m;
  el.disabled  = true;
  el.className = 'tinput ' + (ok ? 'ok' : 'err');
  return ok;
}

// ── Convert mode (24h → 12h) ──────────────────────────────────────────────────
function setupConvert() {
  document.getElementById('question').textContent        = 'Skriv klockslaget utan 24h:';
  document.getElementById('digital-disp').style.display = 'block';
  document.getElementById('digital-disp').textContent   = fmt(target.h, target.m);
  document.getElementById('clock-svg').classList.remove('interactive');

  document.getElementById('answer-area').innerHTML = `
    <div class="ctx-badge">${dayCtx(target.h)}</div>
    <input id="tinput" class="tinput" placeholder="H:MM" maxlength="5"
           inputmode="numeric" autocomplete="off" spellcheck="false"
           oninput="autoColon(this)" onkeydown="if(event.key==='Enter')onBtn()">
  `;
  setTimeout(() => document.getElementById('tinput')?.focus(), 50);
}

function checkConvert() {
  const el = document.getElementById('tinput');
  if (!el) return null;
  const mt = el.value.trim().match(/^(\d{1,2}):(\d{2})$/);
  if (!mt) {
    showFb('Skriv som H:MM (t.ex. 5:00)', false, false);
    answered = false;
    return null;
  }
  const ah = +mt[1], am = +mt[2];
  const ok = ah === target.h - 12 && am === target.m;
  el.disabled  = true;
  el.className = 'tinput ' + (ok ? 'ok' : 'err');
  return ok;
}

// ── Set mode ──────────────────────────────────────────────────────────────────
function setupSet() {
  const svår = LEVELS[levelIdx].svår;
  document.getElementById('question').textContent        = 'Ställ klockan — dra visarna:';
  document.getElementById('digital-disp').style.display = 'block';
  document.getElementById('digital-disp').textContent   = fmt(target.h, target.m);
  document.getElementById('clock-svg').classList.add('interactive');

  document.getElementById('answer-area').innerHTML = `
    <div class="ctx-badge">${dayCtx(target.h)}</div>
    <p class="drag-hint">Dra den <span style="color:#ffaaaa">röda</span> timvisaren &amp; <span style="color:#aaddff">blå</span> minutvisaren</p>
  `;
}

function checkSet() {
  return userH === target.h % 12 && userM === target.m;
}

// ── Main button ───────────────────────────────────────────────────────────────
const CHEER = ['Bra jobbat! 👍','Fantastiskt! ⭐','Rätt! 🎉','Toppen! 🌟','Perfekt! ✨','Precis rätt! 🏆'];

function onBtn() {
  if (answered) { nextQ(); return; }

  let ok;
  if (mode === 'read') {
    ok = checkRead();
    if (ok === null) return;
  } else if (mode === 'set') {
    ok = checkSet();
    if (!ok) renderHands(target.h, target.m);
  } else {
    ok = checkConvert();
    if (ok === null) return;
    if (!ok) renderHands(target.h, target.m);
  }

  answered = true;

  const h12  = target.h - 12;
  const tipEl = document.getElementById('verbal-tip');

  if (mode === 'convert') {
    // Show the conversion formula
    document.getElementById('verbal-main').textContent =
      `${fmt(target.h, target.m)} = ${fmt(h12, target.m)}`;
    tipEl.textContent   = `${target.h} − 12 = ${h12}`;
    tipEl.style.display = 'block';
  } else {
    // Show Swedish verbal form
    const verbal = toSwedish(target.h, target.m);
    document.getElementById('verbal-main').textContent = verbal.charAt(0).toUpperCase() + verbal.slice(1);
    const tip = halvTip(target.h, target.m) || (levelIdx <= 2 ? kvartTip(target.m) : null);
    tipEl.textContent   = tip || '';
    tipEl.style.display = tip ? 'block' : 'none';
  }
  document.getElementById('verbal-box').className = 'verbal-box show';

  if (ok) {
    score  += 10; streak += 1;
    const cheer = CHEER[Math.floor(Math.random()*CHEER.length)];
    showFb(streak > 2 ? `${cheer} ${streak} i rad! 🔥` : cheer, true);
    animBtn();
  } else {
    const correctAns = mode === 'convert' ? fmt(h12, target.m) : fmt(target.h, target.m);
    streak = 0;
    showFb(`Inte riktigt. Rätt svar: ${correctAns}`, false);
  }

  document.getElementById('score-val').textContent  = score;
  document.getElementById('streak-val').textContent = streak;
  document.getElementById('main-btn').textContent   = 'Nästa →';
}

function showFb(txt, ok, persist = true) {
  const el = document.getElementById('feedback');
  el.textContent = txt;
  el.className   = persist ? 'feedback ' + (ok ? 'ok' : 'err') : 'feedback err';
}

function animBtn() {
  const b = document.getElementById('main-btn');
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
}

// ── Drag ──────────────────────────────────────────────────────────────────────
function svgXY(e, el) {
  const r = el.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(214/r.width), y:(e.clientY-r.top)*(214/r.height) };
}

function hourTip() {
  const hA = ((userH%12+userM/60)/12)*2*Math.PI - Math.PI/2;
  return { hx:CX+H_LEN*Math.cos(hA), hy:CY+H_LEN*Math.sin(hA) };
}

function snapMinute(rawM) {
  const ms = LEVELS[levelIdx].minutes;
  if (!ms) return Math.round(rawM) % 60;
  return ms.reduce((best,v) => {
    const d  = Math.abs(((rawM-v+30)%60)-30);
    const db = Math.abs(((rawM-best+30)%60)-30);
    return d < db ? v : best;
  }, ms[0]);
}

function onDown(e) {
  if (mode !== 'set' || answered) return;
  const svg = document.getElementById('clock-svg');
  svg.setPointerCapture(e.pointerId);
  const {x,y}   = svgXY(e, svg);
  const {hx,hy} = hourTip();
  // Grab hour hand only when tapping close to its tip; everything else → minute
  dragging = Math.hypot(x-hx, y-hy) < 28 ? 'h' : 'm';
  doMove(x, y);
}

function onMove(e) {
  if (!dragging || mode !== 'set' || answered) return;
  const {x,y} = svgXY(e, document.getElementById('clock-svg'));
  doMove(x, y);
}

function doMove(x, y) {
  const norm = ((Math.atan2(y-CY,x-CX)+Math.PI/2) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
  if (dragging === 'm') {
    userM = snapMinute((norm/(2*Math.PI))*60);
  } else {
    userH = Math.round((norm/(2*Math.PI))*12) % 12;
  }
  renderHands(userH, userM);
}

function onUp() { dragging = null; }

// ── Mode / level switches ─────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById('btn-choice').classList.toggle('active',  m==='choice');
  document.getElementById('btn-read').classList.toggle('active',    m==='read');
  document.getElementById('btn-set').classList.toggle('active',     m==='set');
  document.getElementById('btn-convert').classList.toggle('active', m==='convert');
  nextQ();
}

function setLevel(i) {
  levelIdx = i;
  document.querySelectorAll('.lbtn').forEach((b,j) => b.classList.toggle('active', j===i));
  nextQ();
}

// ── Events (Pointer Events API for reliable mouse + touch) ───────────────────
const svg = document.getElementById('clock-svg');
svg.addEventListener('pointerdown',   onDown);
svg.addEventListener('pointermove',   onMove);
svg.addEventListener('pointerup',     onUp);
svg.addEventListener('pointercancel', onUp);

nextQ();
</script>
</body>
</html>
