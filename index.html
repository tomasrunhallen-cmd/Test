<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d3d20" />
  <link rel="manifest" href="manifest.json" />
  <title>Plump</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --felt:   #1a6b3a;
      --dark:   #0d3d20;
      --darker: #081f10;
      --gold:   #f0b429;
      --gold2:  #7a5800;
      --cream:  #f5f0e0;
      --muted:  #89b89a;
      --red:    #c0392b;
    }

    body {
      background: var(--dark);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--cream);
      min-height: 100vh;
      padding: 0 0 40px;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ── Header ── */
    .app-header {
      background: var(--darker);
      text-align: center;
      padding: 24px 16px 18px;
      margin-bottom: 20px;
      border-bottom: 2px solid rgba(240,180,41,0.2);
    }
    .app-title {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-shadow: 2px 2px 0 var(--gold2);
    }
    .app-sub {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── Cards ── */
    .card {
      background: rgba(0,0,0,0.35);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }

    /* ── Form elements ── */
    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 11px 13px;
      border-radius: 9px;
      border: 2px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.4);
      color: var(--cream);
      font-size: 1rem;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus { border-color: var(--gold); }
    input[type="number"] { text-align: center; margin-bottom: 0; }
    select option { background: #1a1a1a; }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 0.88rem;
      color: var(--cream);
      cursor: pointer;
    }
    input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--gold); }

    /* ── Buttons ── */
    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 11px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: transform 0.1s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn + .btn { margin-top: 10px; }
    .btn-primary { background: var(--gold); color: #1a1a1a; }
    .btn-ghost   { background: rgba(255,255,255,0.1); color: var(--cream); }
    .btn-sm      { display: inline-block; width: auto; padding: 8px 16px; font-size: 0.78rem; }

    /* ── Score table ── */
    .table-wrap {
      overflow-x: auto;
      border-radius: 10px;
      margin-bottom: 14px;
      -webkit-overflow-scrolling: touch;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.83rem; min-width: 280px; }
    thead th {
      background: rgba(0,0,0,0.5);
      padding: 10px 6px;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    thead th:first-child { text-align: left; padding-left: 12px; }
    tbody td {
      padding: 7px 6px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    tbody td:first-child {
      text-align: left;
      padding-left: 12px;
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
    }
    tbody tr:nth-child(even) td { background: rgba(0,0,0,0.15); }
    tbody tr.active-row td { background: rgba(240,180,41,0.12) !important; }
    tfoot td {
      background: rgba(0,0,0,0.55) !important;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 11px 6px;
      color: var(--gold);
      border-top: 2px solid rgba(240,180,41,0.25);
    }
    tfoot td:first-child { font-size: 0.65rem; color: var(--muted); font-weight: 400; }

    /* Editable name headers */
    .name-input {
      border: none;
      background: transparent;
      color: var(--cream);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
      width: 100%;
      outline: none;
      cursor: text;
      border-bottom: 1px dashed rgba(255,255,255,0.2);
      padding: 2px 2px 3px;
    }
    .name-input:focus { border-bottom-color: var(--gold); background: rgba(0,0,0,0.3); border-radius: 4px; }

    /* Delta colours */
    .pos { color: #4ade80; font-weight: 600; }
    .neg { color: #f87171; font-weight: 600; }
    .zero { color: #6b7280; }
    .sub { font-size: 0.65rem; color: var(--muted); display: block; }

    /* ── Round form ── */
    .player-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .player-row:last-of-type { border-bottom: none; }
    .player-row-name { flex: 1; font-size: 0.9rem; font-weight: 600; }
    .player-row-sub  { font-size: 0.7rem; color: var(--muted); }
    .num-box {
      width: 62px;
      flex-shrink: 0;
      padding: 10px 4px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.45);
      color: var(--cream);
      font-size: 1.05rem;
      text-align: center;
      outline: none;
      -webkit-appearance: none;
    }
    .num-box:focus { border-color: var(--gold); }

    /* ── Alerts ── */
    .alert {
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 0.78rem;
      margin-bottom: 12px;
      line-height: 1.6;
    }
    .alert-warn { background: rgba(192,57,43,0.25); border: 1px solid rgba(192,57,43,0.45); color: #ffaa99; }

    /* ── Badge ── */
    .badge {
      display: inline-block;
      background: var(--gold);
      color: #1a1a1a;
      font-size: 0.6rem;
      font-weight: 800;
      border-radius: 4px;
      padding: 2px 6px;
      letter-spacing: 0.06em;
      vertical-align: middle;
      margin-left: 5px;
    }

    /* ── Pill ── */
    .pill {
      display: inline-block;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 5px 13px;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Rules ── */
    .rules {
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      padding: 14px;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 2;
      margin-top: 14px;
    }
    .rules b { color: var(--cream); }

    /* ── End screen ── */
    .podium {
      background: rgba(240,180,41,0.15);
      border: 2px solid rgba(240,180,41,0.3);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
      margin-bottom: 16px;
    }
    .podium-icon  { font-size: 2.5rem; line-height: 1; }
    .podium-name  { font-size: 1.8rem; font-weight: 900; color: var(--gold); margin-top: 8px; }
    .podium-score { font-size: 1rem; color: var(--muted); margin-top: 4px; }

    .rank-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .rank-num { color: var(--muted); margin-right: 10px; font-size: 0.85rem; }
    .rank-pts { font-weight: 700; font-size: 1.1rem; }

    /* ── Game top bar ── */
    .game-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--darker);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 16px;
    }
    .game-bar-title { font-size: 1.1rem; font-weight: 900; color: var(--gold); letter-spacing: 0.1em; }
    .game-bar-sub   { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>

<!-- ════════ SETUP ════════ -->
<div id="screen-setup" class="screen active">
  <div class="app-header">
    <div class="app-title">♣ PLUMP ♠</div>
    <div class="app-sub">Poängprotokoll · 3 spelare</div>
  </div>
  <div class="container">
    <div class="card">
      <div class="card-title">Spelarnamn</div>
      <div id="name-fields"></div>
    </div>

    <div class="card">
      <div class="card-title">Spelinställningar</div>
      <label for="sel-max">Max kort per runda</label>
      <select id="sel-max">
        <option value="5">5 kort</option>
        <option value="7">7 kort</option>
        <option value="8">8 kort</option>
        <option value="9">9 kort</option>
        <option value="10" selected>10 kort</option>
        <option value="12">12 kort</option>
        <option value="15">15 kort</option>
      </select>
      <label class="checkbox-row" for="chk-back">
        <input type="checkbox" id="chk-back" checked />
        Spela upp <em style="margin:0 4px;">och</em> ner (1 → max → 1)
      </label>
      <button class="btn btn-primary" onclick="startGame()">Starta spel ▶</button>
    </div>

    <div class="rules">
      <b>Svenska standardregler</b><br>
      • Rätt bud: <b style="color:#4ade80">+bud +5 poäng</b><br>
      • Fel bud: <b style="color:#f87171">−(hur många stick du missar)</b><br>
      • Givarens bud: summan av alla bud ≠ antal kort<br>
      • Giv roterar ett steg medsols varje runda
    </div>
  </div>
</div>

<!-- ════════ GAME ════════ -->
<div id="screen-game" class="screen">
  <div class="game-bar">
    <div>
      <div class="game-bar-title">♣ PLUMP ♠</div>
      <div class="game-bar-sub" id="bar-sub"></div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="tryNewGame()">↩ Nytt spel</button>
  </div>
  <div class="container">
    <div id="score-table-wrap"></div>
    <div id="round-form-wrap"></div>
  </div>
</div>

<!-- ════════ END ════════ -->
<div id="screen-end" class="screen">
  <div class="app-header">
    <div class="app-title">♣ PLUMP ♠</div>
    <div class="app-sub">Spelet är slut!</div>
  </div>
  <div class="container">
    <div id="end-content"></div>
    <button class="btn btn-primary" onclick="replayGame()">Spela igen (samma namn)</button>
    <button class="btn btn-ghost"   onclick="goSetup()">Nytt spel</button>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────
const G = {
  players:     ['Spelare 1', 'Spelare 2', 'Spelare 3'],
  scores:      [0, 0, 0],
  history:     [],   // [{cards, bids, taken, deltas}]
  roundSeq:    [],
  roundIdx:    0,
  phase:       'bidding',  // 'bidding' | 'results'
  pendingBids: null,
};

// ── Setup ─────────────────────────────────────────────────────────────────
function initNameFields() {
  document.getElementById('name-fields').innerHTML = G.players.map((n, i) => `
    <label>Spelare ${i + 1}</label>
    <input type="text" id="pn${i}" value="${esc(n)}" placeholder="Spelare ${i + 1}" maxlength="20" />
  `).join('');
}

function startGame(keepNames) {
  if (!keepNames) {
    G.players = [0, 1, 2].map(i => {
      const v = (document.getElementById('pn' + i) || {}).value || '';
      return v.trim() || 'Spelare ' + (i + 1);
    });
  }

  const maxC   = parseInt((document.getElementById('sel-max') || {}).value || '10');
  const goBack = (document.getElementById('chk-back') || {checked: true}).checked;
  const up     = Array.from({length: maxC}, function(_, i) { return i + 1; });
  G.roundSeq   = goBack ? up.concat(up.slice(0, -1).reverse()) : up;

  G.scores      = [0, 0, 0];
  G.history     = [];
  G.roundIdx    = 0;
  G.phase       = 'bidding';
  G.pendingBids = null;

  showScreen('game');
  render();
}

function replayGame()  { startGame(true); }
function goSetup()     { showScreen('setup'); initNameFields(); }
function tryNewGame()  {
  if (confirm('Avbryta spelet och starta nytt?')) goSetup();
}

// ── Screens ───────────────────────────────────────────────────────────────
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById('screen-' + name).classList.add('active');
  window.scrollTo(0, 0);
}

// ── Render ────────────────────────────────────────────────────────────────
function render() {
  const cards     = G.roundSeq[G.roundIdx];
  const totalR    = G.roundSeq.length;
  const dealerIdx = G.roundIdx % 3;

  document.getElementById('bar-sub').textContent =
    'Runda ' + (G.roundIdx + 1) + ' / ' + totalR + ' · ' + cards + ' kort · Giv: ' + G.players[dealerIdx];

  renderTable(dealerIdx);
  renderForm(cards, dealerIdx);
}

function renderTable(dealerIdx) {
  const heads = G.players.map(function(p, i) {
    const badge = (i === dealerIdx && G.phase === 'bidding')
      ? '<span class="badge">GIV</span>' : '';
    return '<th><input class="name-input" value="' + esc(p) + '" ' +
      'oninput="G.players[' + i + ']=this.value.trim()||\'Spelare ' + (i+1) + '\'; reRenderTable()" ' +
      'title="Klicka för att redigera namn" />' + badge + '</th>';
  }).join('');

  const histRows = G.history.map(function(r) {
    const cells = [0, 1, 2].map(function(p) {
      const d   = r.deltas[p];
      const cls = d > 0 ? 'pos' : d < 0 ? 'neg' : 'zero';
      const sign = d > 0 ? '+' : '';
      return '<td><span class="' + cls + '">' + sign + d + '</span>' +
             '<span class="sub">' + r.bids[p] + 'b / ' + r.taken[p] + 's</span></td>';
    }).join('');
    return '<tr><td>' + r.cards + '&nbsp;kort</td>' + cells + '</tr>';
  }).join('');

  let curRow = '';
  if (G.roundIdx < G.roundSeq.length) {
    const c     = G.roundSeq[G.roundIdx];
    const label = G.phase === 'bidding' ? 'Budar…' : 'Räknar stick…';
    curRow = '<tr class="active-row"><td>' + c + '&nbsp;kort' +
      '<span class="sub" style="color:#f0b429;">' + label + '</span></td>' +
      '<td colspan="3" style="color:#6b7280;font-size:0.75rem;text-align:center;">pågår</td></tr>';
  }

  const totals = G.scores.map(function(s) { return '<td>' + s + '</td>'; }).join('');

  document.getElementById('score-table-wrap').innerHTML =
    '<div class="table-wrap"><table>' +
    '<thead><tr><th>Runda</th>' + heads + '</tr></thead>' +
    '<tbody>' + histRows + curRow + '</tbody>' +
    '<tfoot><tr><td>TOTALT</td>' + totals + '</tr></tfoot>' +
    '</table></div>';
}

function reRenderTable() { renderTable(G.roundIdx % 3); }

function renderForm(cards, dealerIdx) {
  const wrap = document.getElementById('round-form-wrap');

  if (G.phase === 'bidding') {
    const order = [(dealerIdx + 1) % 3, (dealerIdx + 2) % 3, dealerIdx];
    const rows = order.map(function(i) {
      const badge = i === dealerIdx ? '<span class="badge">GIV</span>' : '';
      return '<div class="player-row">' +
        '<div class="player-row-name">' + esc(G.players[i]) + badge + '</div>' +
        '<input type="number" class="num-box" id="bid_' + i + '" ' +
        'min="0" max="' + cards + '" placeholder="—" inputmode="numeric" ' +
        'oninput="checkBidSum(' + cards + ',' + dealerIdx + ')" /></div>';
    }).join('');

    wrap.innerHTML = '<div class="card">' +
      '<div class="card-title">Runda ' + (G.roundIdx + 1) + ' — Buda</div>' +
      '<div class="pill">📋 ' + cards + ' stick att fördela · Giv: ' + esc(G.players[dealerIdx]) + '</div>' +
      '<div id="bid-warn" class="alert alert-warn" style="display:none;"></div>' +
      rows +
      '<div style="margin-top:16px;"><button class="btn btn-primary" onclick="confirmBids(' + cards + ',' + dealerIdx + ')">Bekräfta bud →</button></div>' +
      '</div>';

  } else {
    const bids = G.pendingBids;
    const rows = [0, 1, 2].map(function(i) {
      return '<div class="player-row">' +
        '<div class="player-row-name">' + esc(G.players[i]) +
        '<span class="player-row-sub">bud: ' + bids[i] + '</span></div>' +
        '<input type="number" class="num-box" id="taken_' + i + '" ' +
        'min="0" max="' + cards + '" placeholder="—" inputmode="numeric" ' +
        'oninput="checkTakenSum(' + cards + ')" /></div>';
    }).join('');

    wrap.innerHTML = '<div class="card">' +
      '<div class="card-title">Runda ' + (G.roundIdx + 1) + ' — Ange tagna stick</div>' +
      '<div class="pill">✋ Totalt ' + cards + ' stick att fördela</div>' +
      '<div id="taken-warn" class="alert alert-warn" style="display:none;"></div>' +
      rows +
      '<div style="margin-top:16px;"><button class="btn btn-primary" onclick="confirmTaken(' + cards + ')">Bekräfta resultat ✓</button></div>' +
      '</div>';
  }
}

// ── Validation ────────────────────────────────────────────────────────────
function getNumVals(prefix) {
  return [0, 1, 2].map(function(i) {
    const el = document.getElementById(prefix + i);
    const v  = el ? parseInt(el.value) : NaN;
    return isNaN(v) ? null : v;
  });
}

function checkBidSum(cards, dealerIdx) {
  const vals = getNumVals('bid_');
  const allFilled = vals.every(function(v) { return v !== null; });
  const sum  = vals.reduce(function(a, b) { return a + (b || 0); }, 0);
  const warn = document.getElementById('bid-warn');
  if (!warn) return;
  if (allFilled && sum === cards) {
    warn.textContent = '⚠ Summan av buden = ' + cards +
      ' (antal kort). Givaren (' + G.players[dealerIdx] + ') måste ändra sitt bud.';
    warn.style.display = 'block';
  } else {
    warn.style.display = 'none';
  }
}

function checkTakenSum(cards) {
  const vals = getNumVals('taken_');
  const allFilled = vals.every(function(v) { return v !== null; });
  const sum  = vals.reduce(function(a, b) { return a + (b || 0); }, 0);
  const warn = document.getElementById('taken-warn');
  if (!warn) return;
  if (allFilled && sum !== cards) {
    warn.textContent = '⚠ Summan av tagna stick är ' + sum + ', men måste vara ' + cards + '.';
    warn.style.display = 'block';
  } else {
    warn.style.display = 'none';
  }
}

// ── Actions ───────────────────────────────────────────────────────────────
function confirmBids(cards, dealerIdx) {
  const bids = getNumVals('bid_');
  if (bids.some(function(v) { return v === null || v < 0; })) {
    alert('Fyll i giltiga bud (≥ 0) för alla spelare.'); return;
  }
  if (bids.some(function(v) { return v > cards; })) {
    alert('Bud kan vara max ' + cards + ' (antal kort i rundan).'); return;
  }
  const sum = bids.reduce(function(a, b) { return a + b; }, 0);
  if (sum === cards) {
    alert('Summan av buden är ' + sum + ' = antal kort (' + cards + ').\n' +
      'Givaren (' + G.players[dealerIdx] + ') måste buda något annat.');
    return;
  }
  G.pendingBids = bids;
  G.phase       = 'results';
  render();
}

function confirmTaken(cards) {
  const taken = getNumVals('taken_');
  if (taken.some(function(v) { return v === null || v < 0; })) {
    alert('Fyll i antal tagna stick (≥ 0) för alla spelare.'); return;
  }
  const sum = taken.reduce(function(a, b) { return a + b; }, 0);
  if (sum !== cards) {
    alert('Summan av tagna stick måste vara ' + cards + ', men är ' + sum + '.'); return;
  }

  const bids   = G.pendingBids;
  const deltas = [0, 1, 2].map(function(i) {
    return taken[i] === bids[i]
      ? bids[i] + 5
      : -(Math.abs(taken[i] - bids[i]));
  });

  G.scores  = G.scores.map(function(s, i) { return s + deltas[i]; });
  G.history.push({cards: cards, bids: bids, taken: taken, deltas: deltas});
  G.roundIdx++;
  G.phase       = 'bidding';
  G.pendingBids = null;

  if (G.roundIdx >= G.roundSeq.length) {
    renderEndScreen();
  } else {
    render();
  }
}

// ── End screen ────────────────────────────────────────────────────────────
function renderEndScreen() {
  const ranked  = [0, 1, 2].sort(function(a, b) { return G.scores[b] - G.scores[a]; });
  const winIdx  = ranked[0];

  const rankRows = ranked.map(function(p, i) {
    return '<div class="rank-row">' +
      '<div><span class="rank-num">' + (i + 1) + '.</span><strong>' + esc(G.players[p]) + '</strong></div>' +
      '<div class="rank-pts" style="color:' + (i === 0 ? 'var(--gold)' : 'var(--cream)') + '">' +
      G.scores[p] + ' poäng</div></div>';
  }).join('');

  document.getElementById('end-content').innerHTML =
    '<div class="podium">' +
    '<div class="podium-icon">🏆</div>' +
    '<div class="podium-name">' + esc(G.players[winIdx]) + '</div>' +
    '<div class="podium-score">vinner med ' + G.scores[winIdx] + ' poäng!</div>' +
    '</div>' +
    '<div class="card">' + rankRows + '</div>';

  showScreen('end');
}

// ── Utils ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Init ──────────────────────────────────────────────────────────────────
initNameFields();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
