<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>RETRO PONG</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Press Start 2P', monospace, 'Courier New';
      color: #0f0;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    h1 {
      font-size: clamp(0.9rem, 4vw, 2rem);
      letter-spacing: 0.3em;
      margin-bottom: 4px;
      text-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
      animation: flicker 3s infinite;
    }

    #subtitle {
      font-size: clamp(0.3rem, 1.5vw, 0.5rem);
      letter-spacing: 0.2em;
      color: #0a0;
      margin-bottom: 10px;
    }

    #game-container {
      position: relative;
      transform-origin: top center;
    }

    canvas {
      display: block;
      border: 2px solid #0f0;
      box-shadow: 0 0 20px #0f0, 0 0 40px #0a0;
    }

    #scanlines {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    #controls {
      margin-top: 10px;
      font-size: clamp(0.28rem, 1.2vw, 0.38rem);
      color: #080;
      letter-spacing: 0.08em;
      text-align: center;
      line-height: 2.4;
    }
    #controls span { color: #0f0; }
    #controls.touch-mode .kb { display: none; }
    #controls.kb-mode .touch-hint { display: none; }

    /* Touch buttons rendered on canvas — shown via JS overlay */

    @keyframes flicker {
      0%,95%,100% { opacity:1; }
      96% { opacity:0.8; }
      97% { opacity:1; }
      98% { opacity:0.6; }
      99% { opacity:1; }
    }

    @media (max-width: 600px) {
      #subtitle { display: none; }
    }
  </style>
</head>
<body>
  <h1>PONG</h1>
  <div id="subtitle">RETRO ARCADE &mdash; 1972</div>
  <div id="game-container">
    <canvas id="pong" width="800" height="500"></canvas>
    <div id="scanlines"></div>
  </div>
  <div id="controls">
    <span class="kb">W / S</span><span class="kb"> &mdash; P1 &nbsp;|&nbsp; </span>
    <span class="kb">&uarr;&darr;</span><span class="kb"> &mdash; P2 &nbsp;|&nbsp; </span>
    <span>SPACE</span> &mdash; Pause &nbsp;|&nbsp;
    <span>R</span> &mdash; Restart
    <br>
    <span class="touch-hint">Dra vänster sida &mdash; P1 &nbsp;|&nbsp; Dra höger sida &mdash; P2</span>
  </div>

  <script>
    // ─── Canvas & scale ───────────────────────────────────────────────────────
    const canvas = document.getElementById('pong');
    const ctx    = canvas.getContext('2d');
    const container = document.getElementById('game-container');
    const W = canvas.width, H = canvas.height;

    function resizeCanvas() {
      const pad = 16;
      const titleH = document.querySelector('h1').offsetHeight +
                     (document.getElementById('subtitle').offsetHeight || 0) + 30;
      const ctrlH  = document.getElementById('controls').offsetHeight + 16;
      const maxW = window.innerWidth  - pad * 2;
      const maxH = window.innerHeight - titleH - ctrlH - pad * 2;
      const scale = Math.min(maxW / W, maxH / H, 1);
      container.style.transform = `scale(${scale})`;
      container.style.marginBottom = `${(scale - 1) * H * 0.5}px`;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Map a DOM touch/click point to canvas logical coords
    function toCanvasCoords(clientX, clientY) {
      const r = canvas.getBoundingClientRect();
      return {
        x: (clientX - r.left) / r.width  * W,
        y: (clientY - r.top)  / r.height * H
      };
    }

    // ─── Audio ────────────────────────────────────────────────────────────────
    let audioCtx;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }
    function beep(freq, dur, type = 'square', vol = 0.12) {
      try {
        const ac = getAudio();
        const o = ac.createOscillator(), g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type = type;
        o.frequency.setValueAtTime(freq, ac.currentTime);
        g.gain.setValueAtTime(vol, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
        o.start(); o.stop(ac.currentTime + dur);
      } catch(_) {}
    }
    const SFX = {
      paddle: () => beep(480, 0.05),
      wall:   () => beep(240, 0.05),
      score:  () => beep(160, 0.28, 'sawtooth'),
      start:  () => {
        beep(330,0.07); setTimeout(()=>beep(440,0.07),80); setTimeout(()=>beep(550,0.12),160);
      },
    };

    // ─── Constants ───────────────────────────────────────────────────────────
    const PADDLE_W = 12, PADDLE_H = 80, BALL_SIZE = 12;
    const PADDLE_SPEED = 5, WIN_SCORE = 7;
    const GREEN = '#00ff41', DIM = '#006618', MID = '#00cc33';

    // ─── Mode ────────────────────────────────────────────────────────────────
    // 'select' → show mode picker, '2p' → two players, 'ai' → vs AI
    let mode  = 'select';
    let state = 'select'; // select | waiting | playing | paused | goal | gameover

    // ─── Game objects ────────────────────────────────────────────────────────
    const p1 = { x: 30,              y: H/2 - PADDLE_H/2, score: 0 };
    const p2 = { x: W-30-PADDLE_W,   y: H/2 - PADDLE_H/2, score: 0 };
    const ball = { x:0, y:0, dx:0, dy:0, trail:[] };

    function resetBall(dir = 1) {
      ball.x = W/2; ball.y = H/2;
      const ang = (Math.random()*60-30) * Math.PI/180;
      const spd = 5;
      ball.dx = dir * spd * Math.cos(ang);
      ball.dy = spd * Math.sin(ang);
      ball.trail = [];
    }

    function resetGame() {
      p1.score = 0; p2.score = 0;
      p1.y = H/2 - PADDLE_H/2;
      p2.y = H/2 - PADDLE_H/2;
      resetBall(Math.random()<0.5?1:-1);
      state = 'waiting';
    }

    // ─── Input: keyboard ─────────────────────────────────────────────────────
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ') {
        e.preventDefault();
        handleAction();
      }
      if (e.key==='r'||e.key==='R') { if(state!=='select') { resetGame(); } }
      if (e.key==='1') selectMode('2p');
      if (e.key==='2') selectMode('ai');
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    function handleAction() {
      getAudio()?.resume?.();
      if (state==='select') return;
      if (state==='waiting') { state='playing'; SFX.start(); }
      else if (state==='playing') { state='paused'; }
      else if (state==='paused')  { state='playing'; }
      else if (state==='gameover') { resetGame(); }
    }

    function selectMode(m) {
      mode = m;
      resetGame();
      getAudio()?.resume?.();
    }

    // ─── Input: touch ─────────────────────────────────────────────────────────
    // Track one touch per side
    const touchY = { left: null, right: null }; // canvas-space Y of finger centre

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      getAudio()?.resume?.();
      for (const t of e.changedTouches) {
        const c = toCanvasCoords(t.clientX, t.clientY);
        if (c.x < W/2) touchY.left  = c.y;
        else            touchY.right = c.y;
      }
      // Tap anywhere in overlay states to advance
      if (state==='select') {
        // handled by button check in draw loop / tap detection below
      } else {
        handleAction();
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        const c = toCanvasCoords(t.clientX, t.clientY);
        if (c.x < W/2) touchY.left  = c.y;
        else            touchY.right = c.y;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        const c = toCanvasCoords(t.clientX, t.clientY);

        // Mode selection via tap on buttons
        if (state === 'select') {
          const btn1 = modeButtonRect('2p');
          const btn2 = modeButtonRect('ai');
          if (inRect(c, btn1)) { selectMode('2p'); return; }
          if (inRect(c, btn2)) { selectMode('ai');  return; }
        }

        if (c.x < W/2) touchY.left  = null;
        else            touchY.right = null;
      }
    }, { passive: false });

    function inRect(pt, r) {
      return pt.x >= r.x && pt.x <= r.x+r.w && pt.y >= r.y && pt.y <= r.y+r.h;
    }

    // ─── Click support for desktop mode selection ─────────────────────────────
    canvas.addEventListener('click', e => {
      if (state === 'select') {
        const c = toCanvasCoords(e.clientX, e.clientY);
        if (inRect(c, modeButtonRect('2p'))) selectMode('2p');
        if (inRect(c, modeButtonRect('ai')))  selectMode('ai');
      } else {
        handleAction();
      }
    });

    // ─── AI ──────────────────────────────────────────────────────────────────
    const AI_SPEED = 3.8;
    function updateAI() {
      const target = ball.y - PADDLE_H/2 + BALL_SIZE/2;
      if (p2.y < target - 3) p2.y = Math.min(p2.y + AI_SPEED, target);
      else if (p2.y > target + 3) p2.y = Math.max(p2.y - AI_SPEED, target);
    }

    // ─── Physics ─────────────────────────────────────────────────────────────
    function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

    function rectCollide(bx,by,bs,px,py,pw,ph){
      return bx<px+pw && bx+bs>px && by<py+ph && by+bs>py;
    }

    function paddleBounce(paddle) {
      const hit = (ball.y+BALL_SIZE/2) - (paddle.y+PADDLE_H/2);
      const norm = hit / (PADDLE_H/2);
      const angle = norm * 60 * Math.PI/180;
      const spd = Math.min(Math.hypot(ball.dx,ball.dy)+0.2, 12);
      ball.dx = (ball.dx>0?1:-1) * spd * Math.cos(angle);
      ball.dy = spd * Math.sin(angle);
    }

    // ─── Update ───────────────────────────────────────────────────────────────
    function update() {
      if (state !== 'playing') return;

      // Keyboard P1
      if (keys['w']||keys['W']) p1.y -= PADDLE_SPEED;
      if (keys['s']||keys['S']) p1.y += PADDLE_SPEED;

      // Touch P1 (left side) — snap paddle centre to finger
      if (touchY.left !== null) {
        p1.y += clamp((touchY.left - PADDLE_H/2) - p1.y, -PADDLE_SPEED*2, PADDLE_SPEED*2);
      }

      // P2: AI or keyboard+touch
      if (mode === 'ai') {
        updateAI();
      } else {
        if (keys['ArrowUp'])   p2.y -= PADDLE_SPEED;
        if (keys['ArrowDown']) p2.y += PADDLE_SPEED;
        if (touchY.right !== null) {
          p2.y += clamp((touchY.right - PADDLE_H/2) - p2.y, -PADDLE_SPEED*2, PADDLE_SPEED*2);
        }
      }

      p1.y = clamp(p1.y, 0, H-PADDLE_H);
      p2.y = clamp(p2.y, 0, H-PADDLE_H);

      // Ball
      ball.trail.push({x:ball.x, y:ball.y});
      if (ball.trail.length > 8) ball.trail.shift();

      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.y <= 0)           { ball.y=0;           ball.dy= Math.abs(ball.dy); SFX.wall(); }
      if (ball.y+BALL_SIZE >= H) { ball.y=H-BALL_SIZE; ball.dy=-Math.abs(ball.dy); SFX.wall(); }

      if (ball.dx<0 && rectCollide(ball.x,ball.y,BALL_SIZE,p1.x,p1.y,PADDLE_W,PADDLE_H)) {
        ball.x = p1.x+PADDLE_W; paddleBounce(p1); SFX.paddle();
      }
      if (ball.dx>0 && rectCollide(ball.x,ball.y,BALL_SIZE,p2.x,p2.y,PADDLE_W,PADDLE_H)) {
        ball.x = p2.x-BALL_SIZE; paddleBounce(p2); SFX.paddle();
      }

      if (ball.x+BALL_SIZE < 0) { p2.score++; SFX.score(); afterGoal(1);  }
      else if (ball.x > W)      { p1.score++; SFX.score(); afterGoal(-1); }
    }

    function afterGoal(nextDir) {
      if (p1.score>=WIN_SCORE || p2.score>=WIN_SCORE) {
        state = 'gameover';
      } else {
        state = 'goal';
        ball.x=W/2; ball.y=H/2; ball.dx=0; ball.dy=0; ball.trail=[];
        setTimeout(()=>{ if(state==='goal'){ resetBall(nextDir); state='playing'; } }, 1500);
      }
    }

    // ─── Draw helpers ─────────────────────────────────────────────────────────
    function drawText(text, y, size='1rem', color=GREEN, x=W/2) {
      ctx.shadowColor=color; ctx.shadowBlur=12;
      ctx.fillStyle=color;
      ctx.font=`${size} 'Press Start 2P', monospace`;
      ctx.textAlign='center';
      ctx.fillText(text, x, y);
      ctx.shadowBlur=0;
    }

    function drawButton(label, r, hover=false) {
      ctx.shadowColor = GREEN; ctx.shadowBlur = hover ? 20 : 8;
      ctx.strokeStyle = GREEN; ctx.lineWidth = 2;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      if (hover) { ctx.fillStyle='rgba(0,255,65,0.12)'; ctx.fillRect(r.x,r.y,r.w,r.h); }
      ctx.shadowBlur = 0;
      drawText(label, r.y + r.h/2 + 6, '0.55rem', GREEN, r.x + r.w/2);
    }

    function modeButtonRect(m) {
      const bw=220, bh=52, gap=40, top=H/2+10;
      if (m==='2p') return { x:W/2-gap/2-bw, y:top, w:bw, h:bh };
      return               { x:W/2+gap/2,    y:top, w:bw, h:bh };
    }

    // ─── Draw ─────────────────────────────────────────────────────────────────
    function draw() {
      // Background
      ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);

      if (state === 'select') {
        drawSelectScreen();
        return;
      }

      // Dashed centre line
      ctx.setLineDash([12,14]); ctx.strokeStyle=DIM; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      drawPaddle(p1); drawPaddle(p2);

      // Ball
      if (state !== 'waiting') drawBall();

      // Score
      ctx.shadowColor=GREEN; ctx.shadowBlur=15; ctx.fillStyle=GREEN;
      ctx.font="bold 52px 'Press Start 2P', monospace";
      ctx.textAlign='right'; ctx.fillText(p1.score, W/2-40, 70);
      ctx.textAlign='left';  ctx.fillText(p2.score, W/2+40, 70);
      ctx.shadowBlur=0;

      // Touch drag guides (visible when touching)
      if (touchY.left!==null && state==='playing') {
        ctx.strokeStyle='rgba(0,255,65,0.25)'; ctx.lineWidth=1; ctx.setLineDash([4,6]);
        ctx.beginPath(); ctx.moveTo(0,touchY.left); ctx.lineTo(W/2-10,touchY.left); ctx.stroke();
        ctx.setLineDash([]);
      }
      if (touchY.right!==null && state==='playing' && mode!=='ai') {
        ctx.strokeStyle='rgba(0,255,65,0.25)'; ctx.lineWidth=1; ctx.setLineDash([4,6]);
        ctx.beginPath(); ctx.moveTo(W/2+10,touchY.right); ctx.lineTo(W,touchY.right); ctx.stroke();
        ctx.setLineDash([]);
      }

      // Overlays
      if (state==='waiting') {
        ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
        drawText('RETRO PONG', H/2-60, '2rem');
        drawText('TRYCK/TAP FÖR ATT STARTA', H/2+5, '0.5rem', MID);
        if (mode==='2p') drawText('VÄNSTER SIDA  vs  HÖGER SIDA', H/2+55, '0.42rem', DIM);
        else             drawText('DU vs DATORN', H/2+55, '0.42rem', DIM);
      }

      if (state==='paused') {
        ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
        drawText('PAUS', H/2-20, '1.5rem');
        drawText('TRYCK FÖR ATT FORTSÄTTA', H/2+40, '0.5rem', MID);
      }

      if (state==='goal') drawText('MÅL!', H/2-20, '1.5rem');

      if (state==='gameover') {
        ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
        const winner = p1.score>=WIN_SCORE
          ? (mode==='ai'?'DU VINNER!':'SPELARE 1 VINNER!')
          : (mode==='ai'?'DATORN VINNER!':'SPELARE 2 VINNER!');
        drawText('GAME OVER', H/2-70, '1.5rem');
        drawText(winner, H/2-10, '0.9rem');
        drawText('TRYCK FÖR ATT SPELA IGEN', H/2+55, '0.45rem', MID);
      }
    }

    function drawSelectScreen() {
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
      drawText('RETRO PONG', H/2-100, '2rem');
      drawText('VÄLJ SPELLÄGE', H/2-30, '0.6rem', MID);
      drawButton('TVÅSPELARLGE', modeButtonRect('2p'));
      drawButton('MOT DATORN',   modeButtonRect('ai'));
      drawText('1 / 2 på tangentbord', H/2+100, '0.38rem', DIM);
    }

    function drawPaddle(p) {
      ctx.shadowColor=GREEN; ctx.shadowBlur=18; ctx.fillStyle=GREEN;
      ctx.fillRect(p.x, p.y, PADDLE_W, PADDLE_H);
      ctx.shadowBlur=0; ctx.fillStyle='#afffcb';
      ctx.fillRect(p.x+2, p.y+4, 3, PADDLE_H-8);
    }

    function drawBall() {
      ball.trail.forEach((t,i)=>{
        const a=(i+1)/ball.trail.length;
        ctx.globalAlpha=a*0.35; ctx.fillStyle=GREEN;
        const s=BALL_SIZE*a;
        ctx.fillRect(t.x+(BALL_SIZE-s)/2, t.y+(BALL_SIZE-s)/2, s, s);
      });
      ctx.globalAlpha=1;
      ctx.shadowColor=GREEN; ctx.shadowBlur=20; ctx.fillStyle=GREEN;
      ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);
      ctx.shadowBlur=0; ctx.fillStyle='#afffcb';
      ctx.fillRect(ball.x+2, ball.y+2, 5, 5);
    }

    // ─── Game loop ────────────────────────────────────────────────────────────
    let last=0;
    function loop(ts) {
      if (ts-last < 100) update();
      last=ts;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
