<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RETRO PONG</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace, 'Courier New';
      color: #0f0;
      overflow: hidden;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.3em;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
      animation: flicker 3s infinite;
    }

    #subtitle {
      font-size: 0.5rem;
      letter-spacing: 0.2em;
      color: #0a0;
      margin-bottom: 20px;
    }

    #game-container {
      position: relative;
    }

    canvas {
      display: block;
      border: 2px solid #0f0;
      box-shadow: 0 0 20px #0f0, 0 0 40px #0a0, inset 0 0 20px rgba(0,255,0,0.05);
    }

    /* CRT scanline overlay */
    canvas::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px
      );
      pointer-events: none;
    }

    #scanlines {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.18) 3px,
        rgba(0, 0, 0, 0.18) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    #controls {
      margin-top: 16px;
      font-size: 0.38rem;
      color: #080;
      letter-spacing: 0.1em;
      text-align: center;
      line-height: 2.2;
    }

    #controls span {
      color: #0f0;
    }

    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.8; }
      97% { opacity: 1; }
      98% { opacity: 0.6; }
      99% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>PONG</h1>
  <div id="subtitle">RETRO ARCADE &mdash; 1972</div>
  <div id="game-container">
    <canvas id="pong" width="800" height="500"></canvas>
    <div id="scanlines"></div>
  </div>
  <div id="controls">
    <span>W / S</span> &nbsp;&mdash;&nbsp; Player 1 &nbsp;&nbsp;|&nbsp;&nbsp;
    <span>&uarr; / &darr;</span> &nbsp;&mdash;&nbsp; Player 2 &nbsp;&nbsp;|&nbsp;&nbsp;
    <span>SPACE</span> &nbsp;&mdash;&nbsp; Pause &nbsp;&nbsp;|&nbsp;&nbsp;
    <span>R</span> &nbsp;&mdash;&nbsp; Restart
  </div>

  <script>
    const canvas = document.getElementById('pong');
    const ctx = canvas.getContext('2d');

    const W = canvas.width;
    const H = canvas.height;

    // --- Audio (Web Audio API retro beeps) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function beep(freq, duration, type = 'square', vol = 0.15) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + duration);
    }

    const SFX = {
      paddle: () => beep(480, 0.05),
      wall:   () => beep(240, 0.05),
      score:  () => beep(160, 0.25, 'sawtooth'),
      start:  () => { beep(330, 0.07); setTimeout(() => beep(440, 0.07), 80); setTimeout(() => beep(550, 0.12), 160); },
    };

    // --- Game State ---
    const PADDLE_W = 12;
    const PADDLE_H = 80;
    const BALL_SIZE = 12;
    const PADDLE_SPEED = 5;
    const WIN_SCORE = 7;

    let state = 'waiting'; // waiting | playing | paused | goal | gameover
    let goalTimer = 0;

    const p1 = { x: 30,       y: H / 2 - PADDLE_H / 2, score: 0, dy: 0 };
    const p2 = { x: W - 30 - PADDLE_W, y: H / 2 - PADDLE_H / 2, score: 0, dy: 0 };

    const ball = { x: 0, y: 0, dx: 0, dy: 0, trail: [] };

    function resetBall(dir = 1) {
      ball.x = W / 2;
      ball.y = H / 2;
      const angle = (Math.random() * 60 - 30) * Math.PI / 180;
      const speed = 5;
      ball.dx = dir * speed * Math.cos(angle);
      ball.dy = speed * Math.sin(angle);
      ball.trail = [];
    }

    function resetGame() {
      p1.score = 0;
      p2.score = 0;
      p1.y = H / 2 - PADDLE_H / 2;
      p2.y = H / 2 - PADDLE_H / 2;
      resetBall(Math.random() < 0.5 ? 1 : -1);
      state = 'waiting';
    }

    resetGame();

    // --- Input ---
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;

      if (e.key === ' ') {
        e.preventDefault();
        if (state === 'waiting') {
          state = 'playing';
          SFX.start();
          audioCtx.resume();
        } else if (state === 'playing') {
          state = 'paused';
        } else if (state === 'paused') {
          state = 'playing';
        } else if (state === 'gameover') {
          resetGame();
        }
      }

      if (e.key === 'r' || e.key === 'R') {
        resetGame();
      }
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    // --- Physics helpers ---
    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }

    function rectCollide(bx, by, bs, px, py, pw, ph) {
      return bx < px + pw && bx + bs > px && by < py + ph && by + bs > py;
    }

    function paddleBounce(paddle) {
      // Reflect dx
      ball.dx = -ball.dx;
      // Adjust angle based on hit position on paddle
      const hitPos = (ball.y + BALL_SIZE / 2) - (paddle.y + PADDLE_H / 2);
      const normalized = hitPos / (PADDLE_H / 2); // -1 to 1
      const maxAngle = 60 * Math.PI / 180;
      const angle = normalized * maxAngle;
      const speed = Math.min(Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy) + 0.2, 12);
      ball.dx = (ball.dx > 0 ? 1 : -1) * speed * Math.cos(angle);
      ball.dy = speed * Math.sin(angle);
    }

    // --- Update ---
    function update() {
      if (state !== 'playing') return;

      // Move paddles
      if (keys['w'] || keys['W']) p1.y -= PADDLE_SPEED;
      if (keys['s'] || keys['S']) p1.y += PADDLE_SPEED;
      if (keys['ArrowUp'])   p2.y -= PADDLE_SPEED;
      if (keys['ArrowDown']) p2.y += PADDLE_SPEED;

      p1.y = clamp(p1.y, 0, H - PADDLE_H);
      p2.y = clamp(p2.y, 0, H - PADDLE_H);

      // Ball trail
      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 8) ball.trail.shift();

      // Move ball
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Wall collision (top/bottom)
      if (ball.y <= 0) {
        ball.y = 0;
        ball.dy = Math.abs(ball.dy);
        SFX.wall();
      }
      if (ball.y + BALL_SIZE >= H) {
        ball.y = H - BALL_SIZE;
        ball.dy = -Math.abs(ball.dy);
        SFX.wall();
      }

      // Paddle collision
      if (ball.dx < 0 && rectCollide(ball.x, ball.y, BALL_SIZE, p1.x, p1.y, PADDLE_W, PADDLE_H)) {
        ball.x = p1.x + PADDLE_W;
        paddleBounce(p1);
        SFX.paddle();
      }
      if (ball.dx > 0 && rectCollide(ball.x, ball.y, BALL_SIZE, p2.x, p2.y, PADDLE_W, PADDLE_H)) {
        ball.x = p2.x - BALL_SIZE;
        paddleBounce(p2);
        SFX.paddle();
      }

      // Scoring
      if (ball.x + BALL_SIZE < 0) {
        p2.score++;
        SFX.score();
        afterGoal(1);
      } else if (ball.x > W) {
        p1.score++;
        SFX.score();
        afterGoal(-1);
      }
    }

    function afterGoal(nextDir) {
      if (p1.score >= WIN_SCORE || p2.score >= WIN_SCORE) {
        state = 'gameover';
      } else {
        state = 'goal';
        goalTimer = 90;
        ball.x = W / 2; ball.y = H / 2; ball.dx = 0; ball.dy = 0; ball.trail = [];
        setTimeout(() => {
          if (state === 'goal') {
            resetBall(nextDir);
            state = 'playing';
          }
        }, 1500);
      }
    }

    // --- Drawing ---
    const GREEN = '#00ff41';
    const DIM   = '#006618';
    const MID   = '#00cc33';

    function drawBackground() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);

      // Center dashed line
      ctx.setLineDash([12, 14]);
      ctx.strokeStyle = DIM;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(W / 2, 0);
      ctx.lineTo(W / 2, H);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawPaddle(p) {
      // Glow
      ctx.shadowColor = GREEN;
      ctx.shadowBlur = 18;
      ctx.fillStyle = GREEN;
      ctx.fillRect(p.x, p.y, PADDLE_W, PADDLE_H);

      // Inner highlight
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#afffcb';
      ctx.fillRect(p.x + 2, p.y + 4, 3, PADDLE_H - 8);
    }

    function drawBall() {
      // Trail
      ball.trail.forEach((t, i) => {
        const alpha = (i + 1) / ball.trail.length;
        ctx.globalAlpha = alpha * 0.35;
        ctx.fillStyle = GREEN;
        const s = BALL_SIZE * alpha;
        ctx.fillRect(t.x + (BALL_SIZE - s) / 2, t.y + (BALL_SIZE - s) / 2, s, s);
      });
      ctx.globalAlpha = 1;

      // Ball glow
      ctx.shadowColor = GREEN;
      ctx.shadowBlur = 20;
      ctx.fillStyle = GREEN;
      ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#afffcb';
      ctx.fillRect(ball.x + 2, ball.y + 2, 5, 5);
    }

    function drawScore() {
      ctx.shadowColor = GREEN;
      ctx.shadowBlur = 15;
      ctx.fillStyle = GREEN;
      ctx.font = "bold 52px 'Press Start 2P', monospace";
      ctx.textAlign = 'right';
      ctx.fillText(p1.score, W / 2 - 40, 70);
      ctx.textAlign = 'left';
      ctx.fillText(p2.score, W / 2 + 40, 70);
      ctx.shadowBlur = 0;
    }

    function drawText(text, y, size = '1rem', color = GREEN) {
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = color;
      ctx.font = `${size} 'Press Start 2P', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(text, W / 2, y);
      ctx.shadowBlur = 0;
    }

    function drawOverlay() {
      if (state === 'waiting') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);
        drawText('RETRO PONG', H / 2 - 60, '2rem');
        drawText('PRESS SPACE TO START', H / 2, '0.6rem', MID);
        drawText('W/S  vs  \u2191\u2193', H / 2 + 50, '0.55rem', DIM);
      }

      if (state === 'paused') {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, W, H);
        drawText('PAUSED', H / 2 - 20, '1.5rem');
        drawText('PRESS SPACE TO RESUME', H / 2 + 40, '0.5rem', MID);
      }

      if (state === 'goal') {
        drawText('GOAL!', H / 2 - 20, '1.5rem');
      }

      if (state === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(0, 0, W, H);
        const winner = p1.score >= WIN_SCORE ? 'PLAYER 1' : 'PLAYER 2';
        drawText('GAME OVER', H / 2 - 70, '1.5rem');
        drawText(`${winner} WINS!`, H / 2 - 10, '1rem');
        drawText('PRESS SPACE OR R TO RESTART', H / 2 + 55, '0.45rem', MID);
      }
    }

    function draw() {
      drawBackground();
      drawPaddle(p1);
      drawPaddle(p2);
      if (state !== 'waiting') drawBall();
      drawScore();
      drawOverlay();
    }

    // --- Game Loop ---
    let last = 0;
    function loop(ts) {
      const dt = ts - last;
      last = ts;
      if (dt < 100) { // skip huge gaps (tab hidden etc.)
        update();
      }
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
