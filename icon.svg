<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#000"/>
  <!-- Left paddle -->
  <rect x="60" y="156" width="44" height="200" fill="#00ff41" rx="4"/>
  <!-- Right paddle -->
  <rect x="408" y="156" width="44" height="200" fill="#00ff41" rx="4"/>
  <!-- Ball -->
  <rect x="234" y="234" width="44" height="44" fill="#00ff41"/>
  <!-- Centre dashed line -->
  <rect x="240" y="60"  width="10" height="50" fill="#006618" rx="2"/>
  <rect x="240" y="140" width="10" height="50" fill="#006618" rx="2"/>
  <rect x="240" y="220" width="10" height="50" fill="#006618" rx="2"/>
  <rect x="240" y="300" width="10" height="50" fill="#006618" rx="2"/>
  <rect x="240" y="380" width="10" height="50" fill="#006618" rx="2"/>
  <!-- Glow overlay -->
  <rect x="60" y="156" width="44" height="200" fill="none" rx="4"
        style="filter:drop-shadow(0 0 12px #00ff41)"/>
